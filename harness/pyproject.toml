[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "medeval-harness"
dynamic = ["version"]
description = "Evaluation harness for the MedEval triage agent. Scores accuracy, safety, hallucination, cost, and latency."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Raja", email = "rajkumarn2002@gmail.com" }
]
keywords = ["healthcare", "triage", "esi", "llm", "evaluation", "ai", "medical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13",
    "click>=8.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]


[project.urls]
Homepage = "https://github.com/Rajkumar2002-Rk/MedEval"
Repository = "https://github.com/Rajkumar2002-Rk/MedEval"
Issues = "https://github.com/Rajkumar2002-Rk/MedEval/issues"


[project.scripts]
medeval-harness = "medeval_harness.cli:main"


[tool.hatch.version]
path = "src/medeval_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/medeval_harness"]
