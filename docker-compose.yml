services:
  backend:
    image: raja1566/medeval-backend:latest
    container_name: medeval-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: raja1566/medeval-frontend:latest
    container_name: medeval-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend